plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virionbookstore.posvirion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.virionbookstore.posvirion'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    // Keep the test build separate from the production APK on the same phone.
    buildTypes {
        debug {
            applicationIdSuffix '.testing'
            versionNameSuffix '-testing'
        }
    }
}
